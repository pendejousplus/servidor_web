server {
    listen 8080;
    server_name localhost;

    root /var/www/jekyll-cv;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
}
